# Design Ref: §1.2 — the database is the source of truth for jobs.
# Redis may lose a message; mssql may not lose a job. Hence the PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mssql-data
  namespace: noxtend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
  namespace: noxtend
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate — two pods cannot mount the same RWO volume
    type: Recreate
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noxtend-secrets
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          readinessProbe:
            tcpSocket:
              port: 1433
            # SQL Server needs a long first boot to create system databases
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mssql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: noxtend
spec:
  selector:
    app: mssql
  ports:
    - port: 1433
      targetPort: 1433

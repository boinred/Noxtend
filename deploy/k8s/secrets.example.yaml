# Design Ref: §10.3 — connection strings live in a k8s Secret, never in the repo.
#
# Copy to secrets.yaml (git-ignored) and replace the placeholders before applying.
# Env var names use the ASP.NET Core double-underscore convention so that
# ConnectionStrings__Db binds to configuration key "ConnectionStrings:Db".
apiVersion: v1
kind: Secret
metadata:
  name: noxtend-secrets
  namespace: noxtend
type: Opaque
stringData:
  # SA password must satisfy the SQL Server complexity policy or the container exits at boot
  MSSQL_SA_PASSWORD: "CHANGE_ME_Str0ng!Pass"

  ConnectionStrings__Db: "Server=mssql,1433;Database=Noxtend;User Id=sa;Password=CHANGE_ME_Str0ng!Pass;TrustServerCertificate=True"

  # Azurite well-known development account — safe by design, it only exists inside the emulator
  ConnectionStrings__Blob: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

  ConnectionStrings__Redis: "redis:6379"
